# Add at the repository root. Keep docker-compose.yml for local development.
# Coolify parses exclude_from_hc before invoking Docker Compose.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastasys
      POSTGRES_USER: fastasys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: backend/src/Fastasys.ApiService/Dockerfile
      target: migrations
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fastasys;Username=fastasys;Password=${POSTGRES_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/src/Fastasys.ApiService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fastasys;Username=fastasys;Password=${POSTGRES_PASSWORD:?}
      Jwt__Secret: ${JWT_SECRET:?}
    depends_on:
      migrations:
        condition: service_completed_successfully
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

volumes:
  postgres-data:
