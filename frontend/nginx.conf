server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Looking the API up per request (through a variable) instead of once at startup keeps nginx
    # running when the API container isn't up yet or has been recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The translations and index.html keep their names from build to build, so the browser must check for a new
    # version every time (an unchanged file only costs a 304). Without this, a browser could keep an old translation
    # file after a new build and show keys like "activities.signups.title" instead of the texts. The bundles that
    # index.html loads have a hash in their names, so they may be cached as usual.
    location /assets/i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
