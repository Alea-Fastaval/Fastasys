services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fastasys
      POSTGRES_USER: fastasys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastasys-dev-password}
    volumes:
      # PostgreSQL 18 stores clusters in a version-specific subdirectory.
      # Mount its parent directory so the image can manage that layout.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  migrations:
    build:
      context: .
      dockerfile: backend/src/Fastasys.ApiService/Dockerfile
      target: migrations
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fastasys;Username=fastasys;Password=${POSTGRES_PASSWORD:-fastasys-dev-password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/src/Fastasys.ApiService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fastasys;Username=fastasys;Password=${POSTGRES_PASSWORD:-fastasys-dev-password}
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # nginx proxies /api/ to this service, so start it after the API container exists
    depends_on:
      api:
        condition: service_started
    ports:
      - "4200:80"

volumes:
  postgres-data:
